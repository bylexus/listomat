# Secrets with PLACEHOLDER values. Fill in real values before applying and do
# NOT commit real credentials.
#
# ---------------------------------------------------------------------------
# 1) registry-alexich-cred: image pull secret for the private registry
#    registry.alexi.ch. The listomat namespace needs its own copy (the existing
#    one lives in other namespaces and is not shared).
#
#    Generate it (do not hand-edit the base64) e.g. with:
#      kubectl create secret docker-registry registry-alexich-cred \
#        --docker-server=registry.alexi.ch \
#        --docker-username=<USER> \
#        --docker-password=<PASSWORD> \
#        -n listomat --dry-run=client -o yaml
#    and paste the resulting .dockerconfigjson below.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: registry-alexich-cred
  namespace: listomat
  labels:
    app: listomat
type: kubernetes.io/dockerconfigjson
stringData:
  # REPLACE the whole JSON. "auth" is base64("<user>:<password>").
  .dockerconfigjson: |
    {"auths":{"registry.alexi.ch":{"username":"REPLACE_ME","password":"REPLACE_ME","auth":"REPLACE_ME_BASE64_USER_COLON_PASSWORD"}}}
---
# ---------------------------------------------------------------------------
# 2) listomat-env: all application environment variables (consumed via envFrom
#    in the Deployment by both the migrate initContainer and the app container).
#
#    NUXT_SESSION_PASSWORD: required by nuxt-auth-utils, MUST be >= 32 chars.
#      Generate e.g. with: openssl rand -base64 48
#    DB_URL: matches the image default; kept here so all env is defined in one
#      place and can be overridden centrally.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: listomat-env
  namespace: listomat
  labels:
    app: listomat
type: Opaque
stringData:
  NUXT_SESSION_PASSWORD: "REPLACE_ME_WITH_A_RANDOM_STRING_OF_AT_LEAST_32_CHARS"
  DB_URL: "file:/app/data/listomat.db"
