apiVersion: apps/v1
kind: Deployment
metadata:
  name: listomat
  namespace: listomat
  labels:
    app: listomat
spec:
  replicas: 1
  # Recreate (not RollingUpdate): the volume is ReadWriteOnce on a single node,
  # so no second pod may mount it in parallel during an update.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: listomat
  template:
    metadata:
      labels:
        app: listomat
    spec:
      imagePullSecrets:
        - name: registry-alexich-cred
      # Migrations + admin seed (migrate.cjs runs both; seedAdmin is idempotent).
      initContainers:
        - name: migrate
          image: registry.alexi.ch/listomat:latest
          imagePullPolicy: Always
          command: ["node", "migrate.cjs"]
          envFrom:
            - secretRef:
                name: listomat-env
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: listomat
          image: registry.alexi.ch/listomat:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - secretRef:
                name: listomat-env
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: listomat-data
